name: Validate JavaParser UnaryExpr observer fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkstyle_check:
    name: Validate checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed JavaParser commit
        uses: actions/checkout@v7.0.1
        with:
          repository: wozhenbang2004/javaparser
          ref: bf49a2dce182e454342b158aa1d2396676ab7bbd
          fetch-depth: 4
          persist-credentials: false
      - name: Verify reviewed head and file scope
        shell: python
        run: |
          import subprocess
          expected_head = "bf49a2dce182e454342b158aa1d2396676ab7bbd"
          base = "2d651bec3ba0c40540c658e70cc43888567a9be2"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == expected_head, head
          expected = sorted([
              "javaparser-core-generators/src/main/java/com/github/javaparser/generator/core/node/MainConstructorGenerator.java",
              "javaparser-core-testing/src/test/java/com/github/javaparser/ast/expr/UnaryExprTest.java",
              "javaparser-core/src/main/java/com/github/javaparser/ast/expr/UnaryExpr.java",
          ])
          changed = sorted(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert changed == expected, changed
          print("Reviewed head:", head)
          print("Changed files:", *changed, sep="\n")
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: zulu
      - name: Validate Project Checkstyle
        run: ./mvnw -B checkstyle:check

  spotless_check:
    name: Generate code and check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed JavaParser commit
        uses: actions/checkout@v7.0.1
        with:
          repository: wozhenbang2004/javaparser
          ref: bf49a2dce182e454342b158aa1d2396676ab7bbd
          fetch-depth: 4
          persist-credentials: false
      - name: Verify reviewed head
        shell: python
        run: |
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == "bf49a2dce182e454342b158aa1d2396676ab7bbd", head
          print("Reviewed head:", head)
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: zulu
      - name: Generate code and format
        run: |
          ./run_core_metamodel_generator.sh
          ./run_core_generators.sh
          git diff --exit-code
