name: JSqlParser 2804 validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JSQL_BASE_HEAD: 247e31c557271515d074d23a5f5d11bde6e7f3c1
  JSQL_CANDIDATE_HEAD: 2d2616cae391a9dfcf71f508f1432df82336db2d

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wozhenbang2004/JSqlParser
          ref: 2d2616cae391a9dfcf71f508f1432df82336db2d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify fixed source and six-file scope
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JSQL_CANDIDATE_HEAD"
          git merge-base --is-ancestor "$JSQL_BASE_HEAD" HEAD
          python - <<'PY_SCOPE'
          import os, subprocess
          expected = {
              'src/main/java/net/sf/jsqlparser/expression/operators/arithmetic/IntegerDivision.java',
              'src/main/java/net/sf/jsqlparser/parser/AbstractJSqlParser.java',
              'src/main/java/net/sf/jsqlparser/parser/feature/Feature.java',
              'src/main/java/net/sf/jsqlparser/util/deparser/ExpressionDeParser.java',
              'src/main/jjtree/net/sf/jsqlparser/parser/JSqlParserCC.jjt',
              'src/test/java/net/sf/jsqlparser/statement/select/DuckDBTest.java',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['JSQL_BASE_HEAD'], 'HEAD'], text=True
          ).splitlines())
          assert actual == expected, (actual, expected)
          PY_SCOPE
          git diff --check "$JSQL_BASE_HEAD" HEAD
          git diff --exit-code
          git update-ref refs/remotes/origin/master "$JSQL_BASE_HEAD"
          git worktree add --detach "$RUNNER_TEMP/jsqlparser-2804-base" "$JSQL_BASE_HEAD"
      - name: Prepare one consumer for both versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jsqlparser-2804-consumer"
          cat > "$RUNNER_TEMP/jsqlparser-2804-consumer/DuckDbRoundTrip.java" <<'JAVA_CONSUMER'
          import java.nio.charset.StandardCharsets;
          import java.util.Base64;
          import net.sf.jsqlparser.JSQLParserException;
          import net.sf.jsqlparser.expression.LongValue;
          import net.sf.jsqlparser.expression.operators.arithmetic.IntegerDivision;
          import net.sf.jsqlparser.parser.CCJSqlParserUtil;
          import net.sf.jsqlparser.parser.feature.Feature;
          import net.sf.jsqlparser.statement.Statement;
          import net.sf.jsqlparser.util.deparser.ExpressionDeParser;
          import net.sf.jsqlparser.util.deparser.StatementDeParser;

          public class DuckDbRoundTrip {
              private static String encode(String value) {
                  return Base64.getEncoder().encodeToString(value.getBytes(StandardCharsets.UTF_8));
              }

              public static void main(String[] args) throws Exception {
                  boolean enableIntegerDivision = args.length > 0
                          && "--enable-integer-division".equals(args[0]);
                  for (IntegerDivision division : new IntegerDivision[] {
                          new IntegerDivision().withLeftExpression(new LongValue(7))
                                  .withRightExpression(new LongValue(2)),
                          new IntegerDivision(new LongValue(7), new LongValue(2)),
                          (IntegerDivision) CCJSqlParserUtil.parseExpression("7 DIV 2", false)}) {
                      division.setRightExpression(new LongValue(3));
                      StringBuilder builder = new StringBuilder();
                      division.accept(new ExpressionDeParser(null, builder), null);
                      if (!"7 DIV 3".equals(division.toString()) || !"7 DIV 3".equals(builder.toString())) {
                          throw new AssertionError("DIV construction or rewriting changed");
                      }
                  }
                  System.err.println("PASS DIV constructors and rewritten expression in both renderers");
                  try {
                      CCJSqlParserUtil.parse("SELECT 1 // comment");
                      throw new AssertionError("Double-slash integer division must remain opt-in");
                  } catch (JSQLParserException expected) {
                      System.err.println("PASS default double-slash rejection");
                  }
                  boolean failed = false;
                  for (int index = enableIntegerDivision ? 1 : 0; index < args.length; index++) {
                      String sql = args[index];
                      try {
                          Statement statement = CCJSqlParserUtil.parse(sql, parser -> {
                              if (enableIntegerDivision) {
                                  parser.withFeature(Feature.valueOf("allowDoubleSlashIntegerDivision"), true);
                              }
                          });
                          StringBuilder builder = new StringBuilder();
                          statement.accept(new StatementDeParser(builder));
                          System.out.println("OK\t" + encode(sql) + "\t" + encode(statement.toString())
                                  + "\t" + encode(builder.toString()));
                      } catch (JSQLParserException error) {
                          failed = true;
                          System.out.println("ERROR\t" + encode(sql) + "\t" + encode(error.toString()));
                      }
                  }
                  if (failed) {
                      System.exit(1);
                  }
              }
          }
          JAVA_CONSUMER
          cat > "$RUNNER_TEMP/jsqlparser-2804-consumer/native_consumer.py" <<'PYTHON_CONSUMER'
          import argparse
          import base64
          import json
          import subprocess

          import duckdb


          CASES = [
              ("SELECT 7 // 2", [(3,)], True),
              ("SELECT 7//2", [(3,)], True),
              ("SELECT -7 // 2, 7 // -2, 7.0 // 2", [(-3, -3, 3.5)], True),
              ("SELECT 2 * 9 // 4, 20 // 3 // 2, 1 + 7 // 2 * 3", [(4, 3, 10)], True),
              ("SELECT 7 //*x*/ 2", [(3.5,)], False),
              ("SELECT 7 // /*x*/ 2", [(3,)], True),
              (
                  "SELECT amount // bucket AS quotient FROM samples ORDER BY amount",
                  [(-3,), (3,), (2,)],
                  True,
              ),
              ("SELECT 7 / 2", [(3.5,)], False),
          ]
          INVALID = ["SELECT 7 / / 2", "SELECT 7 /\n/ 2", "SELECT 7 / /*x*/ / 2"]


          def execute(connection, sql):
              result = connection.execute(sql)
              return result.fetchall(), [str(column[1]) for column in result.description]


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--classpath")
              parser.add_argument("--mode", choices=["native", "baseline", "fixed"], default="native")
              args = parser.parse_args()
              if args.mode != "native" and not args.classpath:
                  parser.error("--classpath is required for parser validation")

              assert duckdb.__version__ == "1.5.6", duckdb.__version__
              records = []
              with duckdb.connect() as connection:
                  connection.execute("CREATE TABLE samples (amount INTEGER, bucket INTEGER)")
                  connection.execute("INSERT INTO samples VALUES (7, 2), (-7, 2), (10, 4)")
                  for sql, expected, unsupported_before in CASES:
                      rows, types = execute(connection, sql)
                      assert rows == expected, (sql, rows, expected)
                      records.append({"sql": sql, "rows": rows, "types": types})
                  for sql in INVALID:
                      try:
                          connection.execute(sql)
                      except duckdb.ParserException:
                          continue
                      raise AssertionError(f"DuckDB unexpectedly accepted {sql!r}")

                  if args.mode != "native":
                      queries = [case[0] for case in CASES] + INVALID
                      command = ["java", "-cp", args.classpath, "DuckDbRoundTrip"]
                      if args.mode == "fixed":
                          command.append("--enable-integer-division")
                      process = subprocess.run(
                          [*command, *queries],
                          text=True,
                          capture_output=True,
                          check=False,
                      )
                      print(process.stderr, end="")
                      # Both runs include invalid SQL, so the Java consumer must report a parser failure.
                      assert process.returncode == 1, (process.returncode, process.stdout, process.stderr)
                      lines = process.stdout.splitlines()
                      assert len(lines) == len(queries), (lines, process.stderr)
                      for index, (sql, line) in enumerate(zip(queries, lines)):
                          fields = line.split("\t")
                          decoded = [base64.b64decode(value).decode("utf-8") for value in fields[1:]]
                          assert decoded[0] == sql, (decoded, sql)
                          must_fail = index >= len(CASES) or (
                              args.mode == "baseline" and CASES[index][2]
                          )
                          if must_fail:
                              assert fields[0] == "ERROR", (sql, fields)
                              assert "net.sf.jsqlparser.JSQLParserException" in decoded[1], decoded[1]
                              if index < len(CASES):
                                  records[index]["parser_error"] = decoded[1]
                              continue
                          assert fields[0] == "OK" and len(decoded) == 3, (sql, fields)
                          records[index]["to_string"] = decoded[1]
                          records[index]["deparser"] = decoded[2]
                          for rendered in decoded[1:]:
                              rows, types = execute(connection, rendered)
                              assert rows == CASES[index][1], (sql, rendered, rows)
                              assert types == records[index]["types"], (sql, rendered, types)

              print(json.dumps({"duckdb": duckdb.__version__, "mode": args.mode, "cases": records}, indent=2))
              print(f"PASS {args.mode}: native values, types and SQL boundaries")


          if __name__ == "__main__":
              main()
          PYTHON_CONSUMER
      - name: Install DuckDB for the SQL consumer
        run: python -m pip install duckdb==1.5.6
      - name: Build unchanged baseline and run the SQL consumer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jsqlparser-2804-base"
          ./gradlew classes --no-daemon
          javac -cp "$RUNNER_TEMP/jsqlparser-2804-base/build/classes/java/main:$RUNNER_TEMP/jsqlparser-2804-base/build/resources/main" -d "$RUNNER_TEMP/jsqlparser-2804-consumer" "$RUNNER_TEMP/jsqlparser-2804-consumer/DuckDbRoundTrip.java"
          # The baseline predates the new option. The same SQL is parsed without it.
          python "$RUNNER_TEMP/jsqlparser-2804-consumer/native_consumer.py" --mode baseline --classpath "$RUNNER_TEMP/jsqlparser-2804-consumer:$RUNNER_TEMP/jsqlparser-2804-base/build/classes/java/main:$RUNNER_TEMP/jsqlparser-2804-base/build/resources/main"
      - name: Baseline project benchmark
        id: baseline_benchmark
        shell: bash
        run: |
          cd "$RUNNER_TEMP/jsqlparser-2804-base"
          ./gradlew jmh --no-daemon
      - name: Complete project checks on fixed head
        id: project_checks
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew check --continue --console=plain --no-daemon 2>&1 | tee "$RUNNER_TEMP/jsqlparser-2804-check.log"
      - name: Read actual results and recognize only the reproduced baseline failure
        id: check_results
        if: always()
        working-directory: source
        shell: bash
        run: |
          python - <<'PY_RESULTS'
          import os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          log = (Path(os.environ['RUNNER_TEMP']) / 'jsqlparser-2804-check.log').read_text()
          failed_tasks = re.findall(r'^> Task (:\S+) FAILED$', log, re.MULTILINE)
          assert failed_tasks == [':test'], failed_tasks
          paths = list(Path('build/test-results/test').glob('TEST-*.xml'))
          assert paths, 'Missing actual JUnit output'
          cases = {}
          failures = []
          for path in paths:
              for case in ET.parse(path).getroot().findall('testcase'):
                  key = (case.get('classname'), case.get('name'))
                  cases[key] = case
                  if case.find('failure') is not None or case.find('error') is not None:
                      failures.append((key, case))
          expected = ('net.sf.jsqlparser.statement.lock.MySqlLockTablesTest', 'parsesAMysqldumpScript()')
          assert len(failures) == 1 and failures[0][0] == expected, [key for key, _ in failures]
          failure = failures[0][1].find('failure')
          expected_message = ('org.opentest4j.AssertionFailedError: expected: '
              '<[Drop, CreateTable, LockStatement, Insert, UnlockStatement]> but was: '
              '<[Drop, CreateTable, LockStatement, Alter, Insert, Alter, UnlockStatement]>')
          assert failure is not None and failure.get('message') == expected_message, ET.tostring(failures[0][1])
          required = [
              ('net.sf.jsqlparser.parser.CCJSqlParserUtilTest', 'testDoubleSlashLineCommentsFeature()'),
              ('net.sf.jsqlparser.statement.select.DuckDBTest', 'testIntegerDivisionOperator()'),
              ('net.sf.jsqlparser.statement.select.DuckDBTest', 'testIntegerDivisionCommentBoundaries()'),
          ]
          for key in required:
              case = cases[key]
              assert case.find('failure') is None and case.find('error') is None and case.find('skipped') is None, key
              print(ET.tostring(case, encoding='unicode'), flush=True)
          print(ET.tostring(failures[0][1], encoding='unicode'), flush=True)
          print('Observed', len(cases), 'test cases; only the separately reproduced MariaDB baseline assertion failed.')
          print('The complete-check step and workflow remain failed; no assertion was removed or weakened.')
          PY_RESULTS
      - name: Independently confirm candidate classes build
        id: candidate_build
        if: ${{ always() && steps.check_results.outcome == 'success' }}
        working-directory: source
        run: ./gradlew classes --no-daemon
      - name: Run the same SQL consumer with integer division explicitly enabled
        id: fixed_consumer
        if: ${{ always() && steps.check_results.outcome == 'success' && steps.candidate_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          javac -cp "$GITHUB_WORKSPACE/source/build/classes/java/main:$GITHUB_WORKSPACE/source/build/resources/main" -d "$RUNNER_TEMP/jsqlparser-2804-consumer" "$RUNNER_TEMP/jsqlparser-2804-consumer/DuckDbRoundTrip.java"
          python "$RUNNER_TEMP/jsqlparser-2804-consumer/native_consumer.py" --mode fixed --classpath "$RUNNER_TEMP/jsqlparser-2804-consumer:$GITHUB_WORKSPACE/source/build/classes/java/main:$GITHUB_WORKSPACE/source/build/resources/main"
      - name: Fixed-head project benchmark
        if: ${{ always() && steps.fixed_consumer.outcome == 'success' && steps.baseline_benchmark.outcome == 'success' }}
        working-directory: source
        run: ./gradlew jmh --no-daemon
      - name: Verify candidate files were not modified
        if: ${{ always() && steps.fixed_consumer.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JSQL_CANDIDATE_HEAD"
          git diff --exit-code
